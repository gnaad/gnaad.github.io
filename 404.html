    <title>Page Not Found</title>
    <meta charset="utf-8">

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131316">

    <meta name="msapplication-TileColor" content="#131316">
    <meta name="robots" content="index,follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (() => {
        const stored = localStorage.getItem('theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>

    <meta property="og:type" content="website">

    <meta property="og:locale" content="en_IN">

    <meta name="twitter:card" content="summary_large_image">
